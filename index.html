---
subject: World
title: Home
layout: base.html
---

<h3 class="heading">新着記事！</h3>
<table>
  <colgroup>
    <col style="width: 70%;">
    <col style="width: 30%;">
  <tbody>
    {%- for post in collections.posts %}
      <tr>
        <td><a href="{{ post.url }}">{{ post.data.title }}</a></td>
        <td>{{ post.date | date: "%Y-%m-%d" }}</td>
      </tr>
    {%- endfor %}
  </tbody>
</table>
